<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tonie-Katalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF0F6; --card:#FFFFFF; --ink:#1D2433; --soft:#5A6478;
  --red:#D7263D; --sun:#FFC93C; --line:#D5DDE8; --blue:#2F6FDE;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#141925;--card:#1F2636;--ink:#EEF1F7;--soft:#A3ADC2;--line:#2E3649;--red:#FF4D62;--blue:#6C9BFF}
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Nunito Sans",system-ui,sans-serif}
header{padding:20px 16px 8px;max-width:1100px;margin:0 auto}
h1{font:600 2.1rem/1.1 Fredoka,system-ui,sans-serif;margin:0 0 4px;letter-spacing:-.01em}
h1 .dot{display:inline-block;width:.55em;height:.55em;border-radius:50%;background:var(--red);margin-left:.15em;vertical-align:.1em}
#count{color:var(--soft);margin:0;font-size:.95rem}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 16px 12px;max-width:1100px;margin:0 auto;display:grid;gap:8px;grid-template-columns:1fr 1fr}
.bar input,.chips{grid-column:1/-1}
@media (min-width:760px){.bar{grid-template-columns:repeat(3,1fr)}}
input,select{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px;width:100%;min-width:0}
input:focus,select:focus{outline:none;border-color:var(--red)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;font:600 .92rem Fredoka,sans-serif;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
main{max-width:1100px;margin:0 auto;padding:4px 16px 32px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.t{position:relative;background:var(--card);border:0;border-radius:22px;padding:10px 10px 12px;text-align:left;cursor:pointer;color:inherit;font:inherit;display:flex;flex-direction:column;gap:6px}
.t:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.t img{width:100%;aspect-ratio:1;object-fit:contain;background:var(--bg);border-radius:16px}
.t b{font:600 1rem/1.2 Fredoka,system-ui,sans-serif}
.t span{font-size:.85rem;color:var(--soft);line-height:1.3}
.t small{font-size:.78rem;color:var(--soft)}
.badge{position:absolute;top:16px;left:16px;font:600 .75rem/1 Fredoka,sans-serif;padding:5px 9px;border-radius:999px;letter-spacing:.03em}
.badge.new{background:var(--red);color:#fff}
.badge.soon{background:var(--blue);color:#fff}
#more{display:block;margin:24px auto 0;font:600 1rem Fredoka,sans-serif;background:var(--sun);color:#1D2433;border:0;border-radius:999px;padding:12px 28px;cursor:pointer}
.msg{text-align:center;color:var(--soft);padding:40px 0}
dialog{border:0;border-radius:26px 26px 0 0;padding:0;margin:auto auto 0;width:100%;max-width:560px;max-height:88vh;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(15,20,30,.55)}
.sheet{padding:18px 20px calc(20px + env(safe-area-inset-bottom,0px));overflow:auto;max-height:88vh}
.sheet img{width:160px;height:160px;object-fit:contain;display:block;margin:0 auto 10px;background:var(--bg);border-radius:20px}
.sheet h2{font:600 1.4rem/1.2 Fredoka,sans-serif;margin:0}
.sheet h3{font:500 1.05rem/1.3 Fredoka,sans-serif;margin:2px 0 12px;color:var(--soft)}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px;padding:0;list-style:none}
.facts li{background:var(--bg);border-radius:999px;padding:3px 12px;font-size:.88rem}
.sheet ol{padding-left:1.4em;margin:6px 0 14px}
.sheet audio{width:100%;margin:4px 0 12px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row a,.row button{font:600 .95rem Fredoka,sans-serif;border-radius:999px;padding:9px 18px;border:2px solid var(--line);background:none;color:var(--ink);text-decoration:none;cursor:pointer}
.row a{background:var(--red);border-color:var(--red);color:#fff}
@media (prefers-reduced-motion:no-preference){dialog[open]{animation:up .22s ease-out}@keyframes up{from{transform:translateY(40px);opacity:.4}}}
</style>
</head>
<body>
<header>
  <h1>Tonie-Katalog<span class="dot"></span></h1>
  <p id="count">Lade Datenbank …</p>
</header>
<div class="bar">
  <input id="q" type="search" placeholder="Serie oder Folge suchen, z. B. Benjamin" autocomplete="off">
  <div class="chips" id="when" role="group" aria-label="Zeitraum">
    <button data-w="" aria-pressed="true">Alle</button>
    <button data-w="soon" aria-pressed="false">Bald erhältlich</button>
    <button data-w="new" aria-pressed="false">Neu (3 Monate)</button>
    <button data-w="year" aria-pressed="false">Dieses Jahr</button>
    <button data-w="last" aria-pressed="false">Letztes Jahr</button>
  </div>
  <select id="lang" aria-label="Sprache"></select>
  <select id="cat" aria-label="Art">
    <option value="">Alle Arten</option>
    <option value="play">Hörspiele</option>
    <option value="book">Hörbücher</option>
    <option value="music">Musik &amp; Lieder</option>
    <option value="edu">Wissen</option>
    <option value="creative">Kreativ-Tonies</option>
    <option value="other">Sonstiges</option>
  </select>
  <select id="sort" aria-label="Sortierung">
    <option value="new">Neueste zuerst</option>
    <option value="old">Älteste zuerst</option>
    <option value="az">Serie A–Z</option>
    <option value="za">Serie Z–A</option>
    <option value="long">Längste Laufzeit</option>
    <option value="short">Kürzeste Laufzeit</option>
    <option value="age">Nach Alter (jüngste zuerst)</option>
  </select>
</div>
<main>
  <div id="grid"></div>
  <p class="msg" id="empty" hidden>Nichts gefunden. Anderen Suchbegriff oder Filter probieren.</p>
  <button id="more" hidden>Mehr zeigen</button>
</main>
<dialog id="dlg"><div class="sheet" id="sheet"></div></dialog>

<script>
const SRC="https://raw.githubusercontent.com/toniebox-reverse-engineering/tonies-json/release/toniesV2.json";
const PAGE=60, DAY=86400, NEW_DAYS=90;
const LANGS={"de-de":"Deutsch","de-ch":"Deutsch (CH)","en-gb":"Englisch (UK)","en-us":"Englisch (US)","fr-fr":"Französisch","da-dk":"Dänisch","sv-se":"Schwedisch","nl-nl":"Niederländisch","pl-pl":"Polnisch","it-it":"Italienisch","es-es":"Spanisch"};
const NOW=Math.floor(Date.now()/1000);
const THIS_YEAR=new Date().getFullYear();
// Plausible Erscheinungsdaten: ab 2016 (Toniebox-Start) bis max. 1 Jahr in der Zukunft
const MIN_REL=Date.UTC(2016,0,1)/1000, MAX_REL=NOW+365*DAY;
let all=[],list=[],shown=0,when="";
const $=s=>document.querySelector(s);
const coll=new Intl.Collator("de",{sensitivity:"base",numeric:true});

function group(c){
  c=(c||"").toLowerCase();
  if(c.includes("creative"))return"creative";
  if(c.includes("educational"))return"edu";
  if(c.includes("song")||c==="music"||c==="musik")return"music";
  if(c.startsWith("audio-book"))return"book";
  if(c==="audio-play")return"play";
  return"other";
}
const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const fmtDate=ts=>new Date(ts*1000).toLocaleDateString("de-DE",{day:"numeric",month:"long",year:"numeric"});
const fmtShort=ts=>new Date(ts*1000).toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"});

function build(rows){
  all=[];
  rows.forEach(d=>{
    if(!d.series&&!d.episode)return;
    const r=+d.release||0;
    const rel=(r>=MIN_REL&&r<=MAX_REL)?r:0; // 0 = Datum unbekannt
    all.push({...d,rel,
      yr:rel?new Date(rel*1000).getFullYear():0,
      soon:rel>NOW,
      fresh:rel&&rel<=NOW&&rel>NOW-NEW_DAYS*DAY,
      g:group(d.category),
      txt:((d.series||"")+" "+(d.episode||"")+" "+(d["track-desc"]||[]).join(" ")).toLowerCase()});
  });
  const cur=$("#lang").value;
  const counts={};all.forEach(t=>{const l=t.language||"?";counts[l]=(counts[l]||0)+1});
  $("#lang").innerHTML='<option value="">Alle Sprachen</option>'+Object.keys(counts).sort((a,b)=>counts[b]-counts[a])
    .map(l=>`<option value="${esc(l)}">${esc(LANGS[l]||l)} (${counts[l]})</option>`).join("");
  $("#lang").value=cur||"de-de";
  apply();
}
function load(){
  fetch(SRC).then(r=>{if(!r.ok)throw 0;return r.json()}).then(raw=>{
    const rows=[];raw.forEach(e=>(e.data||[]).forEach(d=>rows.push(d)));
    build(rows);
  }).catch(()=>{$("#count").textContent="Datenbank konnte nicht geladen werden. Internetverbindung prüfen und Seite neu laden."});
}

// Einträge ohne Wert landen immer am Ende
function byNum(key,dir){return(a,b)=>{const x=a[key]||0,y=b[key]||0;if(!x!==!y)return x?-1:1;return dir*(x-y)}}
function byName(dir){return(a,b)=>dir*(coll.compare(a.series||"",b.series||"")||coll.compare(a.episode||"",b.episode||""))}
const SORTS={
  new:byNum("rel",-1), old:byNum("rel",1),
  az:byName(1), za:byName(-1),
  long:byNum("runtime",-1), short:byNum("runtime",1),
  age:(a,b)=>{const x=a.age&&a.age<99?a.age:99,y=b.age&&b.age<99?b.age:99;return x-y||(b.rel-a.rel)}
};
function inWhen(t){
  switch(when){
    case"soon":return t.soon;
    case"new":return t.fresh;
    case"year":return t.yr===THIS_YEAR&&!t.soon;
    case"last":return t.yr===THIS_YEAR-1;
    default:return true;
  }
}
function apply(){
  const q=$("#q").value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const l=$("#lang").value,c=$("#cat").value;
  let s=$("#sort").value;
  list=all.filter(t=>(!l||t.language===l)&&(!c||t.g===c)&&inWhen(t)&&q.every(w=>t.txt.includes(w)));
  // „Bald erhältlich“: nächster Termin zuerst ist sinnvoller
  const cmp=(when==="soon"&&s==="new")?SORTS.old:SORTS[s];
  list.sort(cmp);
  $("#count").textContent=`${list.length.toLocaleString("de-DE")} Tonies`;
  $("#grid").innerHTML="";shown=0;more();
  $("#empty").hidden=list.length>0;
}
function more(){
  const frag=document.createDocumentFragment();
  list.slice(shown,shown+PAGE).forEach((t,i)=>{
    const b=document.createElement("button");b.className="t";b.dataset.i=shown+i;
    const badge=t.soon?`<em class="badge soon">AB ${fmtShort(t.rel)}</em>`:t.fresh?`<em class="badge new">NEU</em>`:"";
    b.innerHTML=`${badge}<img loading="lazy" alt="" src="${esc(t.image||"")}"><b>${esc(t.series||"Ohne Titel")}</b><span>${esc(t.episode||"")}</span>${t.rel&&!t.soon?`<small>${fmtShort(t.rel)}</small>`:""}`;
    frag.appendChild(b);
  });
  $("#grid").appendChild(frag);shown+=PAGE;
  $("#more").hidden=shown>=list.length;
}
function openSheet(t){
  const f=[];
  if(t.rel)f.push(t.soon?`erscheint ${fmtDate(t.rel)}`:`erschienen ${fmtDate(t.rel)}`);
  if(t.runtime)f.push(`${t.runtime} Min.`);
  if(t.age&&t.age<99)f.push(`ab ${t.age} J.`);
  if(t.language)f.push(LANGS[t.language]||t.language);
  const tr=t["track-desc"]||[];
  $("#sheet").innerHTML=`
    <img alt="" src="${esc(t.image||"")}">
    <h2>${esc(t.series||"Ohne Titel")}</h2>
    ${t.episode?`<h3>${esc(t.episode)}</h3>`:""}
    <ul class="facts">${f.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
    ${t.sample?`<audio controls preload="none" src="${esc(t.sample)}"></audio>`:""}
    ${tr.length?`<strong>Inhalt</strong><ol>${tr.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`:""}
    <div class="row">${t.web?`<a href="${esc(t.web)}" target="_blank" rel="noopener">Bei tonies.com ansehen</a>`:""}<button id="close">Schließen</button></div>`;
  $("#dlg").showModal();
  $("#close").onclick=()=>$("#dlg").close();
}
$("#grid").addEventListener("click",e=>{const b=e.target.closest(".t");if(b)openSheet(list[+b.dataset.i])});
$("#dlg").addEventListener("click",e=>{if(e.target.id==="dlg")$("#dlg").close()});
$("#dlg").addEventListener("close",()=>{const a=$("#sheet audio");if(a)a.pause()});
$("#more").onclick=more;
$("#when").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  when=b.dataset.w;
  $("#when").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));
  apply();
});
let tm;$("#q").addEventListener("input",()=>{clearTimeout(tm);tm=setTimeout(apply,200)});
$("#lang").onchange=apply;$("#cat").onchange=apply;$("#sort").onchange=apply;
load();
</script>
</body>
</html>
